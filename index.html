<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동대아파트 부속 상가</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: "Noto Sans KR", sans-serif;
        min-height: 100vh;
    }

    button,
    input {
        font-family: inherit;
    }

    button {
        cursor: pointer;
    }

    /* =========================
       공통 화면
    ========================= */

    .screen {
        display: none;
        min-height: 100vh;
    }

    .screen.active {
        display: flex;
    }

    /* =========================
       시작 화면
    ========================= */

    #setup-screen {
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background:
            radial-gradient(circle at center, #292929 0%, #111 70%);
    }

    .setup-box {
        width: min(700px, 100%);
        border: 1px solid #555;
        background: rgba(20, 20, 20, 0.95);
        padding: 40px;
        box-shadow: 0 0 40px rgba(0,0,0,0.7);
    }

    .title {
        text-align: center;
        font-size: 32px;
        letter-spacing: 5px;
        margin-bottom: 8px;
        color: #eee;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 13px;
        margin-bottom: 35px;
    }

    .section {
        margin-bottom: 30px;
    }

    .section-title {
        font-size: 16px;
        color: #aaa;
        border-bottom: 1px solid #333;
        padding-bottom: 8px;
        margin-bottom: 15px;
    }

    .name-input {
        width: 100%;
        padding: 13px;
        background: #171717;
        border: 1px solid #444;
        color: white;
        outline: none;
    }

    .name-input:focus {
        border-color: #888;
    }

    .stat-row {
        display: grid;
        grid-template-columns: 1fr 70px 100px;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
    }

    .stat-name {
        color: #ccc;
    }

    .stat-value {
        text-align: center;
        color: #fff;
        font-weight: bold;
    }

    .stat-control {
    width: 100%;
    height: 4px;
    appearance: none;
    -webkit-appearance: none;
    background: #3a3a3a;
    border-radius: 0;
    outline: none;
    cursor: pointer;
}

/* Chrome / Edge / Safari */
.stat-control::-webkit-slider-runnable-track {
    height: 4px;
    background: transparent;
    border-radius: 0;
}

.stat-control::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4px;
    border-radius: 0;
    background: #c8c8c8;
    border: 1px solid #666;
    cursor: pointer;
}

/* Firefox */
.stat-control::-moz-range-track {
    height: 4px;
    background: transparent;
    border-radius: 0;
}

.stat-control::-moz-range-progress {
    height: 4px;
    background: #bdbdbd;
    border-radius: 0;
}

.stat-control::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 0;
    background: #c8c8c8;
    border: 1px solid #666;
    cursor: pointer;
}

    .total-stat {
        text-align: right;
        margin-top: 15px;
        color: #aaa;
    }

    .total-stat span {
        color: white;
        font-weight: bold;
    }

    .choice-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .choice {
        flex: 1;
        min-width: 120px;
        padding: 13px;
        background: #1b1b1b;
        border: 1px solid #444;
        color: #bbb;
        transition: 0.2s;
    }

    .choice:hover {
        border-color: #888;
        color: white;
    }

    .choice.selected {
        background: #333;
        border-color: #aaa;
        color: white;
    }

    .npc-description {
        margin-top: 12px;
        padding: 12px;
        background: #181818;
        color: #888;
        font-size: 13px;
        line-height: 1.6;
        min-height: 45px;
    }

    .start-button {
        width: 100%;
        padding: 16px;
        background: #ddd;
        color: #111;
        border: none;
        font-weight: bold;
        letter-spacing: 2px;
        margin-top: 10px;
    }

    .start-button:hover {
        background: white;
    }

.clear-record-button {
    display: block;
    margin: 18px auto 0;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #444;
    color: #999;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s;
}

.clear-record-button:hover {
    border-color: #777;
    color: #ddd;
}

.clear-record-button.has-record {
    color: #b8d4b8;
    border-color: #637963;
}

.record-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
}

.clear-record-button {
    margin: 0;
}

.reset-record-button {
    padding: 8px 12px;
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-size: 11px;
    letter-spacing: 0;
    cursor: pointer;
    transition: 0.2s;
}

.reset-record-button:hover {
    border-color: #777;
    color: #aaa;
}

.ending-list {
    display: none;
    margin: 12px auto 0;
    padding: 12px;
    width: min(400px, 100%);
    background: #171717;
    border: 1px solid #333;
}

.ending-list.open {
    display: block;
}

.ending-list-title {
    color: #777;
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.rulebook-button {
    padding: 8px 12px;
    background: transparent;
    border: 1px solid #444;
    color: #999;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
}

.rulebook-button:hover {
    border-color: #777;
    color: #ddd;
}

.rulebook {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 90;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.78);
}

.rulebook.open {
    display: flex;
}

.rulebook-box {
    width: min(650px, calc(100% - 40px));
    max-height: 80vh;
    padding: 28px;
    background: #151515;
    border: 1px solid #555;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);

    display: flex;
    flex-direction: column;
}

.rulebook-title {
    color: #eee;
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 20px;
    text-align: center;
}

.rulebook-content {
    overflow-y: auto;
    padding-right: 8px;
}

.rulebook-category {
    color: #777;
    font-size: 11px;
    letter-spacing: 2px;
    margin: 18px 0 8px;
    border-bottom: 1px solid #333;
    padding-bottom: 7px;
}

.rulebook-item {
    padding: 10px 0;
    border-bottom: 1px solid #262626;
}

.rulebook-number {
    color: #9fbe9f;
    font-size: 12px;
    margin-bottom: 5px;
}

.rulebook-text {
    color: #aaa;
    font-size: 13px;
    line-height: 1.8;
}

.rulebook-locked {
    color: #4f4f4f;
    font-size: 13px;
    letter-spacing: 1px;
}

.close-rulebook {
    margin-top: 20px;
    padding: 10px;
    background: #222;
    border: 1px solid #444;
    color: #aaa;
    cursor: pointer;
}

.close-rulebook:hover {
    background: #2b2b2b;
    color: #ddd;
}

.new-game-plus-button {
    display: none;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid #637963;
    color: #b8d4b8;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s;
}

.new-game-plus-button.unlocked {
    display: block;
}

.new-game-plus-button:hover {
    background: #263326;
    border-color: #9fbe9f;
    color: #e5f0e5;
}

.reset-confirm {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
}

.reset-confirm.open {
    display: flex;
}

.reset-confirm-box {
    width: min(380px, calc(100% - 40px));
    padding: 28px;
    background: #171717;
    border: 1px solid #555;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    text-align: center;
}

.reset-confirm-title {
    color: #eee;
    font-size: 17px;
    margin-bottom: 15px;
}

.reset-confirm-text {
    color: #888;
    font-size: 13px;
    line-height: 1.8;
}

.reset-confirm-buttons {
    display: flex;
    gap: 8px;
    margin-top: 22px;
}

.reset-confirm-buttons button {
    flex: 1;
    padding: 11px;
    cursor: pointer;
    font-family: inherit;
}

.reset-cancel {
    background: #222;
    border: 1px solid #444;
    color: #aaa;
}

.reset-cancel:hover {
    background: #292929;
    color: #ddd;
}

.reset-ok {
    background: #293629;
    border: 1px solid #637963;
    color: #c9dfc9;
}

.reset-ok:hover {
    background: #344534;
}

.ending-item {
    padding: 7px 0;
    border-bottom: 1px solid #292929;
    color: #aaa;
    font-size: 13px;
}

.ending-item:last-child {
    border-bottom: none;
}

.no-ending {
    color: #555;
    font-size: 12px;
}

    .error {
        color: #b66;
        text-align: center;
        min-height: 22px;
        margin-bottom: 8px;
        font-size: 13px;
    }

    /* =========================
       게임 화면
    ========================= */

    #game-screen {
        position: relative;
        flex-direction: column;
        background: #0e0e0e;
    }

    .top-bar {
        height: 60px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        padding: 0 20px;
        position: relative;
        z-index: 10;
    }

    .help-button {
        background: #1b1b1b;
        border: 1px solid #555;
        color: #ccc;
        padding: 9px 15px;
    }

    .help-button:hover {
        background: #292929;
        color: white;
    }

    .location {
        margin-left: 20px;
        color: #888;
        font-size: 13px;
    }

    .game-content {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 50px 320px 50px 50px;
    }

    .story-box {
        width: min(850px, 100%);
        align-self: center;
    }

    .story-title {
        font-size: 26px;
        color: #eee;
        margin-bottom: 25px;
    }

    .story-text {
        color: #aaa;
        line-height: 2;
        white-space: pre-line;
        min-height: 100px;
    }

    .choices {
        margin-top: 35px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .game-choice {
        width: 100%;
        text-align: left;
        padding: 15px 18px;
        background: #171717;
        border: 1px solid #3c3c3c;
        color: #ccc;
    }

    .game-choice:hover {
        background: #242424;
        border-color: #777;
        color: white;
    }

.game-choice.npc-hint-choice {
    background: #263326;
    border-color: #9fbe9f;
    color: #e5f0e5;
    box-shadow: inset 3px 0 0 #9fbe9f;
}

.game-choice.npc-hint-choice:hover {
    background: #304030;
    border-color: #b8d4b8;
}

    /* =========================
       미니맵
    ========================= */

    .minimap {
        position: fixed;
        top: 75px;
        right: 20px;
        width: 280px;
        background: rgba(18,18,18,0.96);
        border: 1px solid #444;
        padding: 15px;
        z-index: 20;
    }

    .minimap-title {
        font-size: 12px;
        color: #777;
        margin-bottom: 12px;
        letter-spacing: 2px;
    }

    .area-map {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-bottom: 15px;
    }

    .area-node {
        padding: 7px 10px;
        border: 1px solid #444;
        color: #666;
        font-size: 11px;
    }

    .area-node.current {
        color: white;
        border-color: #aaa;
        background: #292929;
    }

    .area-node.visited {
        color: #aaa;
    }

    .shop-map {
        border-top: 1px solid #333;
        padding-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .shop-node {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
        color: #666;
        font-size: 12px;
        border: 1px solid transparent;
    }

    .shop-node.visited {
        color: #aaa;
    }

    .shop-node.current {
        color: white;
        border-color: #777;
    }

    .shop-node.mystery {
        color: #555;
    }

    .shop-dot {
        width: 7px;
        height: 7px;
        border: 1px solid #777;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .shop-node.current .shop-dot {
        background: white;
        border-color: white;
    }

    .shop-node.visited .shop-dot {
        background: #777;
    }

    .shop-node.exit {
        color: #9a7777;
        border-color: #493434;
    }

    /* =========================
       NPC 힌트
    ========================= */

    .hint-box {
        position: fixed;
        left: 20px;
        bottom: 20px;
        width: 360px;
        max-width: calc(100vw - 40px);
        background: #191919;
        border: 1px solid #444;
        padding: 16px;
        z-index: 30;
        display: none;
    }

    .hint-box.active {
        display: block;
    }

    .hint-name {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 8px;
    }

    .hint-text {
        color: #ddd;
        line-height: 1.7;
    }

.rule-popup {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 340px;
    max-width: calc(100vw - 40px);

    padding: 16px 18px;

    background: rgba(20, 24, 20, 0.97);
    border: 1px solid #637963;

    box-shadow:
        0 0 20px rgba(0, 0, 0, 0.6);

    z-index: 50;

    opacity: 0;
    transform: translateY(15px);
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.rule-popup.active {
    opacity: 1;
    transform: translateY(0);
}

.rule-popup-title {
    color: #b8d4b8;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.rule-popup-text {
    color: #ddd;
    font-size: 13px;
    line-height: 1.7;
}

    /* =========================
       엔딩
    ========================= */

    #ending-screen {
        justify-content: center;
        align-items: center;
        padding: 30px;
        background: #090909;
    }

    .ending-box {
        max-width: 700px;
        text-align: center;
    }

    .ending-title {
        font-size: 34px;
        margin-bottom: 25px;
    }

    .ending-text {
        color: #999;
        line-height: 2;
        white-space: pre-line;
        margin-bottom: 30px;
    }

    .restart-button {
        padding: 13px 30px;
        background: #222;
        border: 1px solid #555;
        color: #ccc;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 800px) {
        .setup-box {
            padding: 25px;
        }

        .game-content {
            padding: 30px 20px 120px;
        }

        .minimap {
            width: 220px;
            right: 10px;
            top: 70px;
        }

        .hint-box {
            bottom: 10px;
            left: 10px;
        }
    }
</style>
</head>

<body>

<!-- =====================================================
     시작 화면
===================================================== -->

<div id="setup-screen" class="screen active">

    <div class="setup-box">

        <div class="title">동대아파트 부속 상가</div>
        <div class="subtitle">탐사대원 정보 기록</div>

<div class="record-buttons">

<button
        id="new-game-plus-button"
        class="new-game-plus-button"
    >
        NEW GAME+
    </button>

    <button id="rulebook-button" class="rulebook-button">
        탐사 수칙서
    </button>

    <button id="clear-record-button" class="clear-record-button">
        탐사 기록
        <span id="clear-count"></span>
    </button>

    <button id="reset-record-button" class="reset-record-button">
        기록 초기화
    </button>

</div>


<div id="ending-list" class="ending-list"></div>


<!-- 탐사 수칙서 -->

<div id="rulebook" class="rulebook">

    <div class="rulebook-box">

        <div class="rulebook-title">
            탐사 수칙서
        </div>

        <div id="rulebook-content" class="rulebook-content">
        </div>

        <button
            id="close-rulebook"
            class="close-rulebook"
        >
            닫기
        </button>

    </div>

</div>


<!-- 기록 초기화 확인창 -->

<div id="reset-confirm" class="reset-confirm">

    <div class="reset-confirm-box">

        <div class="reset-confirm-title">
            탐사 기록 초기화
        </div>

        <div class="reset-confirm-text">
            지금까지 발견한 모든 엔딩 기록을 삭제하시겠습니까?
            <br>
            삭제한 기록은 복구할 수 없습니다.
        </div>

        <div class="reset-confirm-buttons">

            <button
                id="cancel-reset"
                class="reset-cancel"
            >
                취소
            </button>

            <button
                id="confirm-reset"
                class="reset-ok"
            >
                초기화
            </button>

        </div>

    </div>

</div>

        <!-- 이름 -->
        <div class="section">
            <div class="section-title">실명</div>

            <input
                id="player-name"
                class="name-input"
                type="text"
                placeholder="이름을 입력하십시오."
                maxlength="20"
            >
        </div>

        <!-- 능력치 -->
        <div class="section">

            <div class="section-title">
                능력치
            </div>

            <div class="stat-row">
                <div class="stat-name">근력</div>
                <div id="strength-value" class="stat-value">3</div>
                <input id="strength" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="stat-row">
                <div class="stat-name">민첩</div>
                <div id="agility-value" class="stat-value">3</div>
                <input id="agility" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="stat-row">
                <div class="stat-name">체력</div>
                <div id="stamina-value" class="stat-value">3</div>
                <input id="stamina" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="stat-row">
                <div class="stat-name">행운</div>
                <div id="luck-value" class="stat-value">3</div>
                <input id="luck" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="stat-row">
                <div class="stat-name">지능</div>
                <div id="intelligence-value" class="stat-value">3</div>
                <input id="intelligence" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="stat-row">
                <div class="stat-name">정신력</div>
                <div id="mentality-value" class="stat-value">3</div>
                <input id="mentality" class="stat-control" type="range" min="1" max="5" value="3">
            </div>

            <div class="total-stat">
    총합: <span id="stat-total">18</span> / 20
    <small>(최소 6)</small>
</div>

        </div>

        <!-- 신앙 -->
        <div class="section">

            <div class="section-title">
                당신은 신을 믿습니까?
            </div>

            <div class="choice-group">

                <button
                    class="choice faith-choice"
                    data-faith="true"
                >
                    예
                </button>

                <button
                    class="choice faith-choice"
                    data-faith="false"
                >
                    아니오
                </button>

            </div>

        </div>

        <!-- NPC -->
        <div class="section">

            <div class="section-title">
                동행할 탐사대원을 선택하십시오.
            </div>

            <div class="choice-group">

                <button class="choice npc-choice" data-npc="none">
                    없음
                </button>

                <button class="choice npc-choice" data-npc="강이한">
                    강이한
                </button>

                <button class="choice npc-choice" data-npc="안정">
                    안정
                </button>

                <button class="choice npc-choice" data-npc="일레냐">
                    일레냐
                </button>

            </div>

            <div id="npc-description" class="npc-description">
                동행하지 않습니다.
            </div>

        </div>

        <div id="setup-error" class="error"></div>

        <button id="start-button" class="start-button">
            탐사를 시작한다
        </button>

    </div>

</div>


<!-- =====================================================
     게임 화면
===================================================== -->

<div id="game-screen" class="screen">

/* =====================================================
   수칙 발견
===================================================== */

function discoverRule(ruleId, text) {

    const discoveredRules =
        JSON.parse(
            localStorage.getItem("dongdaeRules") || "[]"
        );

    // 이미 발견한 수칙이면 아무것도 하지 않음
    if (discoveredRules.includes(ruleId)) {
        return;
    }

    // 새로운 수칙 저장
    discoveredRules.push(ruleId);

    localStorage.setItem(
        "dongdaeRules",
        JSON.stringify(discoveredRules)
    );

    // 발견 팝업 표시
    showRulePopup(text);
}

/* =====================================================
   능력치 설정
===================================================== */

const statInputs = [
    "strength",
    "agility",
    "stamina",
    "luck",
    "intelligence",
    "mentality"
];

function updateStats() {

    let total = 0;

    statInputs.forEach(stat => {

        const input = document.getElementById(stat);
        const value = Number(input.value);

        total += value;

        document.getElementById(
            stat + "-value"
        ).textContent = value;

        const min = Number(input.min);
        const max = Number(input.max);

        const percent =
            ((value - min) / (max - min)) * 100;

        input.style.background =
            `linear-gradient(
                to right,
                #bdbdbd 0%,
                #bdbdbd ${percent}%,
                #3a3a3a ${percent}%,
                #3a3a3a 100%
            )`;
    });

    document.getElementById("stat-total").textContent = total;
}


/* 슬라이더를 움직일 때마다 업데이트 */

statInputs.forEach(stat => {

    const input = document.getElementById(stat);

    input.addEventListener("input", updateStats);

});


/* 처음 화면에서도 현재 값 표시 */

function statCheck(statName, difficulty) {

    let value = player.stats[statName];

    if (
        statName === "agility" &&
        player.companion === "안정"
    ) {
        value -= 2;
    }

    return {
        success: value >= difficulty,
        value: value,
        difficulty: difficulty
    };
}

/* =====================================================
   배열 섞기
===================================================== */

function shuffle(array) {

    const copied = [...array];

    for (let i = copied.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [copied[i], copied[j]] =
            [copied[j], copied[i]];

    }

    return copied;
}

}

function updateMinimap() {

    const areas = [
        ["ground", "area-ground"],
        ["A", "area-a"],
        ["B", "area-b"],
        ["C", "area-c"]
    ];

    areas.forEach(([area, id]) => {

        const element =
            document.getElementById(id);

        element.classList.remove(
            "current",
            "visited"
        );

        if (game.currentArea === area) {
            element.classList.add("current");
        }

        if (game.areaVisited[area]) {
            element.classList.add("visited");
        }

    });


    shopMap.innerHTML = "";


    if (
        game.currentArea !== "A" &&
        game.currentArea !== "B" &&
        game.currentArea !== "C"
    ) {

        const text =
            document.createElement("div");

        text.style.color = "#555";
        text.style.fontSize = "12px";
        text.textContent =
            "지하 진입 후 지도가 표시됩니다.";

        shopMap.appendChild(text);

        return;
    }


    const shops =
        game.randomizedShops[game.currentArea];


    shops.forEach(shop => {

        const node =
            document.createElement("div");

        node.className = "shop-node";


        if (game.visitedShops.includes(shop)) {
            node.classList.add("visited");
        }


        if (game.currentShop === shop) {
            node.classList.add("current");
        }


        const dot =
            document.createElement("div");

        dot.className = "shop-dot";


        const label =
            document.createElement("span");


        /*
           방문하기 전에는
           상가 이름을 숨김
        */

        if (game.visitedShops.includes(shop)) {
            label.textContent = shop;
        } else {
            label.textContent = "???";
            node.classList.add("mystery");
        }


        node.appendChild(dot);
        node.appendChild(label);

        shopMap.appendChild(node);

    });


    /*
       출입구가 나타났다면 표시
    */

    if (game.exitAppeared) {

        const exit =
            document.createElement("div");

        exit.className =
            "shop-node exit";

        exit.innerHTML =
            `<div class="shop-dot"></div>
             <span>출입구</span>`;

        shopMap.appendChild(exit);

    }

}

function showStory(title, text, options = [], hintIndex = null) {

    storyTitle.textContent = title;
    storyText.textContent = text;

    choices.innerHTML = "";

    // 현재 상황의 정답 번호를 저장
    game.currentHintIndex = hintIndex;

    options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "game-choice";

        button.textContent = option.text;

        button.addEventListener(
            "click",
            option.action
        );

        choices.appendChild(button);

    });
}

/* =====================================================
   구역 탐색
===================================================== */

function exploreArea() {

    game.currentShop = null;

    const area =
        game.currentArea;

    const shops =
        game.randomizedShops[area];


    /*
       아직 방문하지 않은 상가 찾기
    */

    const unvisited =
        shops.filter(
            shop =>
                !game.visitedShops.includes(shop)
        );


    const options = [];


    unvisited.forEach(shop => {

        options.push({

            text: `???을 조사한다`,

            action: () => enterShop(shop)

        });

    });


    /*
       구역 이동
    */

    if (area === "A") {

        options.push({

            text: "B구역으로 이동한다",

            action: () => {

                game.currentArea = "B";
                game.areaVisited.B = true;
                game.currentShop = null;

                locationText.textContent =
                    "지하 1층 · B구역";

                updateMinimap();

                exploreArea();

            }

        });

    }


    else if (area === "B") {

        options.push({

            text: "C구역으로 이동한다",

            action: () => {

                game.currentArea = "C";
                game.areaVisited.C = true;
                game.currentShop = null;

                locationText.textContent =
                    "지하 1층 · C구역";

                updateMinimap();

                exploreArea();

            }

        });

    }


    else if (area === "C") {

    options.push({

        text: "탐사를 종료하고 귀환한다",

        action: determineEnding

    });

}


    /*
       모든 상가를 방문했다면
       별도 메시지
    */

    if (unvisited.length === 0) {

        showStory(

            `${area}구역`,

            "이 구역에서 더 이상 조사하지 않은 상가는 없습니다.",

            options

        );

    }

    else {

        showStory(

            `${area}구역`,

            "미니맵에 표시된 상가를 확인하십시오.",

            options

        );

    }


    /*
       행운에 반비례하여
       가짜/의문의 출입구 등장
    */

    trySpawnExit();


    updateMinimap();

}


/* =====================================================
   상가 진입
===================================================== */

function enterShop(shop) {

    game.currentShop = shop;

    if (!game.visitedShops.includes(shop)) {
        game.visitedShops.push(shop);
    }

    updateMinimap();

    switch (shop) {

        case "24시 아이스크림 할인점":
            iceCreamShopEvent();
            break;

        case "할머니 손맛 반찬ㆍ국":
            grandmaShopEvent();
            break;

        case "맛나 분식":
            snackShopEvent();
            break;

        case "청량 청과":
            fruitShopEvent();
            break;

        case "스파클링 쥬얼리":
            jewelryShopEvent();
            break;

        case "패셔니스타":
            fashionShopEvent();
            break;

        case "열쇠ㆍ도장ㆍ간판":
            keyShopEvent();
            break;

        case "딩동댕 피아노 교습소":
            pianoShopEvent();
            break;

        case "동대 코인 노래방":
            karaokeShopEvent();
            break;

        case "믿음교회 별관":
            enterFaithChurch();
            break;

        default:
            showStory(
                shop,
                "아직 구현되지 않은 장소입니다.",
                [
                    {
                        text: "상가에서 나온다",
                        action: leaveShop
                    }
                ]
            );
    }
}


function leaveShop() {

    game.currentShop = null;

    updateMinimap();

    exploreArea();

}

function trySpawnExit() {

    /*
       행운에 반비례

       행운 1 → 35%
       행운 2 → 27%
       행운 3 → 19%
       행운 4 → 11%
       행운 5 → 5%
    */

    if (game.exitAppeared) return;


    const luck =
        player.stats.luck;


    const chance =
        Math.max(
            0.05,
            0.43 - luck * 0.08
        );


    if (Math.random() < chance) {

discoverRule(
        "10",
        "자신이 표시한 출입구 외의 다른 출입구를 믿지 마십시오. 지하 상가의 출입구는 단 하나뿐입니다."
    );

        game.exitAppeared = true;


        showStory(

            "이상 현상",

            "미니맵에 새로운 장소가 나타났습니다.\n\n「출입구」\n\n하지만 당신이 표시해 둔 출입구는 이곳이 아닙니다.",

            [

                {
                    text: "출입구를 확인한다",

                    action: inspectExit

                },

                {
                    text: "무시한다",

                    action: () => {

                        game.exitAppeared = false;

                        updateMinimap();

                        exploreArea();

                    }

                }

            ]

        );

    }

}

   도움 요청
===================================================== */

helpButton.addEventListener(
    "click",
    requestHelp
);


function requestHelp() {

    if (player.companion === "none") {

        showHint(
            "도움 요청",
            "당신과 함께 들어온 동료가 없습니다."
        );

        return;
    }

    const npc = NPC_DATA[player.companion];

    // NPC가 힌트를 줄 수 있는지 판정
    if (Math.random() <= npc.hintChance) {

        // 정답이 지정되지 않은 상황
        if (
            game.currentHintIndex === null ||
            game.currentHintIndex === undefined
        ) {

            showHint(
                player.companion,
                getNPCFlavorText(false)
            );

            return;
        }

        // 현재 화면의 선택지 버튼들
        const buttons =
            document.querySelectorAll(".game-choice");

        const answerButton =
            buttons[game.currentHintIndex];

        if (answerButton) {
            answerButton.classList.add("npc-hint-choice");
        }

        showHint(
            player.companion,
            getNPCFlavorText(true)
        );

    } else {

        showHint(
            player.companion,
            getNPCFlavorText(false)
        );

    }
}

function getNPCFlavorText(success) {

    if (player.companion === "강이한") {

        if (success) {
            return "이쪽을 선택하는 편이 좋겠습니다.";
        }

        return "확실하게 말씀드리기는 어렵습니다.";
    }

    if (player.companion === "안정") {

        if (success) {
            return "저쪽이 맞는 것 같아.";
        }

        return "음… 잘 모르겠어.";
    }

    if (player.companion === "일레냐") {

        if (success) {
            return "저쪽으로 가는 게 좋을 것 같아요.";
        }

        return "확신은 없지만… 조금 더 살펴보는 게 좋겠어요.";
    }

    return "";
}

            `당신은 무사히 귀환했습니다.

패셔니스타에서 실종자 한 명을 구조했고,
탐사 과정에서 실종자와 관련된 증거까지 확보했습니다.

수색연은 이번 탐사를 성공 사례로 기록했습니다.`

        );

        return;
    }


    /*
       생존자는 구조했지만 증거 부족
    */

    if (survivorRescued) {

        endGame(

            "GOOD ENDING - 구조",

            `당신은 실종자 한 명을 데리고 돌아왔습니다.

그러나 현장에서 확보한 자료는 충분하지 않았습니다.

생존자를 구했다는 것만으로도 성공이라고 할 수 있지만,
탐사의 모든 진실을 밝혀내지는 못했습니다.`

        );

        return;
    }


    /*
       증거 확보
    */

    if (
        grandmaEvidence ||
        fashionEvidence
    ) {

        endGame(

            "GOOD ENDING - 수습",

            `당신은 무사히 귀환했습니다.

생존자를 직접 구조하지는 못했지만,
실종자와 관련된 물품과 단서를 확보했습니다.

이 작은 흔적들이
언젠가 실종자들의 행방을 밝혀낼지도 모릅니다.`

        );

        return;
    }


    /*
       아무것도 크게 확보하지 못함
    */

    endGame(

        "NORMAL ENDING - 생존",

        `당신은 살아 돌아왔습니다.

그러나 확보한 것은 거의 없습니다.

왜 사람들이 사라졌는지,
지하 상가에서 무슨 일이 일어나는지,
당신은 알아내지 못했습니다.

탐사 기록에는 단 한 줄만 남았습니다.

「생존하여 귀환함. 추가 탐사 필요.」`

    );

}


/* =====================================================
   엔딩 기록 저장
===================================================== */

function saveEnding(title) {

    const endings =
        JSON.parse(
            localStorage.getItem("dongdaeEndings") || "[]"
        );

    if (!endings.includes(title)) {

        endings.push(title);

        localStorage.setItem(
            "dongdaeEndings",
            JSON.stringify(endings)
        );
    }
}

/* =====================================================
   엔딩
===================================================== */

function endGame(title, text) {

    saveEnding(title);

    gameScreen.classList.remove("active");

    endingScreen.classList.add("active");

    document.getElementById("ending-title")
        .textContent = title;

    document.getElementById("ending-text")
        .textContent = text;

}

        Math.random() < discoveryChance;

        intelligenceCheck.success &&

        type: "evidence",

    input.style.border = "1px solid #444";
    input.style.color = "#eee";
    input.style.outline = "none";
    input.style.fontFamily = "inherit";


    choices.appendChild(input);


    const button =
        document.createElement("button");

    button.className =
        "game-choice";

    button.textContent =
        "노래를 시작한다";


    button.addEventListener(
        "click",
        () => {

            const songTitle =
                input.value.trim();

            if (!songTitle) {

                input.focus();

                return;

            }

            karaokeStartEvent(songTitle);

        }
    );


    choices.appendChild(button);

}

/* =====================================================
   점수 판정
===================================================== */

function karaokeScoreEvent() {

    let score;


    /*
       일레냐가 동행하면
       높은 점수를 받을 가능성이 높아짐.
       원문에서는 100점을 받고 나온 기록이 있음.
    */

    if (player.companion === "일레냐") {

        const roll =
            Math.random();

        if (roll < 0.35) {
            score = 100;
        } else {
            score =
                85 +
                Math.floor(
                    Math.random() * 16
                );
        }

    } else {

        score =
            50 +
            Math.floor(
                Math.random() * 51
            );

    }


    game.karaokeScore =
        score;


    if (score >= 75) {

        karaokeSuccessEvent(score);

    } else {

        karaokeFailEvent(score);

    }

}

            category.textContent =
                currentCategory;

            rulebookContent.appendChild(
                category
            );
        }


        const item =
            document.createElement("div");

        item.className =
            "rulebook-item";


        const number =
            document.createElement("div");

        number.className =
            "rulebook-number";

        number.textContent =
            `제${rule.id}수칙`;


        const text =
            document.createElement("div");

        text.className =
            "rulebook-text";


        if (discoveredRules.includes(rule.id)) {

            text.textContent =
                rule.text;

        } else {

            text.className =
                "rulebook-locked";

            text.textContent =
                "???";
        }


        item.appendChild(number);
        item.appendChild(text);

        rulebookContent.appendChild(item);

    });

}

rulebookButton.addEventListener(
    "click",
    () => {

        updateRuleBook();

        rulebook.classList.add("open");

    }
);


closeRulebook.addEventListener(
    "click",
    () => {

        rulebook.classList.remove("open");

    }
);

const resetConfirm =
    document.getElementById("reset-confirm");

const cancelReset =
    document.getElementById("cancel-reset");

const confirmReset =
    document.getElementById("confirm-reset");


function openResetConfirm() {

    resetConfirm.classList.add("open");

}


cancelReset.addEventListener(
    "click",
    () => {

        resetConfirm.classList.remove("open");

    }
);


confirmReset.addEventListener(
    "click",
    () => {

        // 엔딩 기록 삭제
        localStorage.removeItem("dongdaeEndings");

        // 발견한 수칙 삭제
        localStorage.removeItem("dongdaeRules");

        // NEW GAME+ 해금 상태 삭제
        localStorage.removeItem("dongdaeNewGamePlus");

        // 창 닫기
        resetConfirm.classList.remove("open");

        // 탐사 기록 닫기
        endingList.classList.remove("open");

        // 화면 갱신
        updateEndingList();
        updateNewGamePlus();

    }
);

function updateEndingList() {

    const endings =
        JSON.parse(
            localStorage.getItem("dongdaeEndings") || "[]"
        );

    /* 발견한 엔딩 개수 표시 */

    clearCount.textContent =
        endings.length > 0
            ? ` · ${endings.length}`
            : "";


    /* 아직 엔딩이 없는 경우 */

    if (endings.length === 0) {

        endingList.innerHTML = `
            <div class="ending-list-title">
                발견한 엔딩
            </div>

            <div class="no-ending">
                아직 발견한 엔딩이 없습니다.
            </div>
        `;

        clearRecordButton.classList.remove(
            "has-record"
        );

        return;
    }


    /* 엔딩을 하나라도 발견한 경우 */

    clearRecordButton.classList.add(
        "has-record"
    );


    endingList.innerHTML = `

        <div class="ending-list-title">
            발견한 엔딩
        </div>

        ${endings.map((ending, index) => `
            <div class="ending-item">
                ${index + 1}. ${ending}
            </div>
        `).join("")}

    `;
}


/* 탐사 기록 버튼 */

clearRecordButton.addEventListener(
    "click",
    () => {

        endingList.classList.toggle("open");

        updateEndingList();

    }
);

resetRecordButton.addEventListener(
    "click",
    openResetConfirm
);

/* 시작 화면을 열 때 기록 갱신 */

updateEndingList();
updateNewGamePlus();
newGamePlusButton.addEventListener(
    "click",
    () => {

        localStorage.setItem(
            "dongdaeNewGamePlus",
            "true"
        );

        location.reload();

    }
);

</script>
